<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C232C"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C860"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2A323D" stroke-width="4"/>

  <!-- 상관 스펙트럼 축 (중앙 수평선) -->
  <line x1="96" y1="304" x2="416" y2="304" stroke="#7A6520" stroke-width="5" stroke-linecap="round"/>
  <!-- 눈금 -->
  <g stroke="#7A6520" stroke-width="3">
    <line x1="96"  y1="294" x2="96"  y2="314"/>
    <line x1="176" y1="297" x2="176" y2="311"/>
    <line x1="256" y1="290" x2="256" y2="318"/>
    <line x1="336" y1="297" x2="336" y2="311"/>
    <line x1="416" y1="294" x2="416" y2="314"/>
  </g>

  <!-- 자산 점들: 역행(파랑) 왼쪽, 동행(빨강) 오른쪽 -->
  <circle cx="150" cy="304" r="13" fill="#2B7FD4"/>
  <circle cx="196" cy="304" r="10" fill="#5CA46B"/>
  <circle cx="336" cy="304" r="13" fill="#E64545"/>
  <circle cx="376" cy="304" r="10" fill="#4FC1E9"/>
  <!-- 연결 꼬리 -->
  <line x1="130" y1="304" x2="150" y2="304" stroke="#2B7FD4" stroke-width="3" opacity="0.5"/>
  <line x1="356" y1="304" x2="336" y2="304" stroke="#E64545" stroke-width="3" opacity="0.5"/>

  <!-- 비트코인 심볼 (상단 중앙, 브라스) -->
  <circle cx="256" cy="176" r="72" fill="url(#brass)"/>
  <circle cx="256" cy="176" r="72" fill="none" stroke="#161005" stroke-width="3" opacity="0.25"/>
  <text x="256" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="bold" fill="#161005" text-anchor="middle">₿</text>

  <!-- BTC에서 두 자산으로 뻗는 상관 라인 -->
  <line x1="220" y1="232" x2="150" y2="292" stroke="url(#brass)" stroke-width="3.5" opacity="0.55" stroke-linecap="round"/>
  <line x1="292" y1="232" x2="336" y2="292" stroke="url(#brass)" stroke-width="3.5" opacity="0.55" stroke-linecap="round"/>

  <!-- 하단 미니 게이지 바늘 -->
  <path d="M 256 400 A 56 56 0 0 1 312 400" fill="none" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>
  <path d="M 200 400 A 56 56 0 0 1 256 400" fill="none" stroke="#2A323D" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="400" x2="292" y2="372" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="400" r="8" fill="url(#brass)"/>
</svg>
